<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#174ea6">
  <title>SwiftDesk | Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./login.js"></script>
</head>
<body>
  <main class="login-screen">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand-row">
        <a class="brand brand-login" href="./index.html" aria-label="SwiftDesk">
          <span class="brand-mark">S</span><span>SwiftDesk</span>
        </a>
        <button class="theme-toggle" type="button" aria-label="Cambiar a modo oscuro" aria-pressed="false" title="Cambiar a modo oscuro"><span class="theme-toggle-icon" aria-hidden="true">☾</span></button>
      </div>
      <p class="eyebrow">ESPACIO DE TRABAJO INTERNO</p>
      <h1 id="login-title">Te damos la bienvenida</h1>
      <p class="muted">Inicia sesión con tu cuenta corporativa.</p>
      <div id="config-notice" class="notice notice-warn hidden" role="status"></div>
      <form id="login-form" class="form-stack">
        <label for="login-email">Correo electrónico</label>
        <input id="login-email" type="email" autocomplete="username" placeholder="nombre@empresa.com" required>
        <label for="login-password">Contraseña</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
        <button class="button button-primary button-wide" type="submit" disabled>Iniciar sesión</button>
      </form>
      <button id="forgot-password" class="text-button" type="button">¿Olvidaste tu contraseña?</button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      <p class="login-footnote">Acceso privado para el equipo SwiftDesk.</p>
    </section>
  </main>
</body>
</html>
